name: AggrWatch
options:
  bundleIdPrefix: watch.aggr
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.5.4
  AggrCore:
    path: Packages/AggrCore
  AggrAPI:
    path: Packages/AggrAPI
targets:
  AggrWatch:
    type: application
    platform: iOS
    sources:
      - path: AggrWatch
        excludes:
          - "App/Info.plist"
    dependencies:
      - package: AggrCore
      - package: AggrAPI
      - package: ClerkKit
        product: ClerkKit
      - package: ClerkKit
        product: ClerkKitUI
    info:
      path: AggrWatch/App/Info.plist
      properties:
        CFBundleDisplayName: aggr.watch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CONVEX_URL: $(CONVEX_URL)
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        API_BASE_URL: $(API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: watch.aggr.ios.clerk
            CFBundleURLSchemes: [watch.aggr.ios]
          - CFBundleURLName: watch.aggr.ios.deeplink
            CFBundleURLSchemes: [aggrwatch]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: AggrWatch/App/AggrWatch.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: watch.aggr.ios
        PRODUCT_NAME: AggrWatch
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: aggr-blueprint aggr-testflight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AggrWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AggrWatchTests]
    dependencies:
      - target: AggrWatch
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: watch.aggr.ios.tests
  AggrWatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AggrWatchUITests]
    dependencies:
      - target: AggrWatch
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: watch.aggr.ios.uitests
schemes:
  AggrWatch:
    build:
      targets:
        AggrWatch: all
        AggrWatchTests: [test]
        AggrWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AggrWatchTests
        - AggrWatchUITests
        - package: AggrCore/AggrCoreTests
        - package: AggrAPI/AggrAPITests
